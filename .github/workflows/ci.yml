name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TypeScript
            command: bun run typecheck
          - name: Effect diagnostics
            command: bun run effect:check
          - name: ESLint
            command: bun run lint
          - name: Prettier
            command: bun run format:check
          - name: Knip
            command: bun run knip
          - name: Dependency audit
            command: bun run audit
          - name: PR workflow policy
            command: bun src/sandbox/ci-policy.ts
    steps:
      - name: Anonymous checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin https://github.com/BNasraoui/workflowd.git
          git -c credential.helper= -c http.extraHeader= fetch --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git checkout --detach "$HEAD_SHA"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          token: ""
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  repository-validation:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Anonymous checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin https://github.com/BNasraoui/workflowd.git
          git -c credential.helper= -c http.extraHeader= fetch --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git checkout --detach "$HEAD_SHA"
      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Lint approval workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/ben-approval.yml
      - name: Check push diff
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  deployment-validation:
    name: Deployment (systemd)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Anonymous checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin https://github.com/BNasraoui/workflowd.git
          git -c credential.helper= -c http.extraHeader= fetch --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git checkout --detach "$HEAD_SHA"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          token: ""
          no-cache: true
      - name: Verify deployment admission and checkout isolation
        run: python3 -B -m unittest discover -s test/deploy -v
      - name: Verify systemd units with pinned executable fixture
        run: |
          sudo install -D -m 0755 "$(command -v bun)" /opt/workflowd/bin/bun
          systemd-analyze --user --recursive-errors=no --man=no --generators=no \
            verify deploy/systemd/workflowd.service \
              deploy/systemd/workflowd-runner.service deploy/systemd/workflowd-mcp.service
          # The gateway's unit is a system unit: it runs the Docker client of the runner.
          systemd-analyze --recursive-errors=no --man=no --generators=no \
            verify deploy/systemd/workflowd-gateway.service

  tests:
    name: Tests and changed-line coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {}
    steps:
      - name: Anonymous checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin https://github.com/BNasraoui/workflowd.git
          git -c credential.helper= -c http.extraHeader= fetch --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git checkout --detach "$HEAD_SHA"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          token: ""
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # The tests job and the credential-host job share this setup script, one phase per step.
      - name: Install pinned sandbox clients
        run: bash scripts/evidence/credential-host-setup.sh clients
      - name: Pin credential probe runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
          token: ""
      - name: Record credential probe runtime and prepare sandbox user namespaces
        run: bash scripts/evidence/credential-host-setup.sh namespaces
      # The gateway tests of the plain run mint through the pinned noscope, as the
      # capability-security suites do.
      - name: Prepare pinned fixture-only tools
        run: node deploy/sandbox/public-output.mjs setup -- bash scripts/evidence/capability-ci-setup.sh tools
      # The gateway passes only the anthropic-beta values of its list; this records the values
      # that the pinned Claude Code sends, and fails when one is not on that list. The client
      # runs as this user in a network namespace whose only interface is loopback.
      - name: Record the anthropic-beta values of the pinned Claude Code
        run: |
          sudo /usr/bin/unshare --net /bin/sh -c \
            'ip link set lo up && exec setpriv --reuid="$1" --regid="$2" --init-groups -- env -i "PATH=$3" "HOME=$4" "WORKFLOWD_FIXTURE_NOSCOPE=$5" bun test --path-ignore-patterns= test/capability-gateway/claude-pinned.launcher.test.ts' \
            fixture "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$RUNNER_TEMP/capability-tools/bin/noscope"
      - name: Verify credential probe entrypoints
        run: >-
          systemd-run --user --wait --pipe --collect
          -p MemoryMax=6G -p MemorySwapMax=0 --working-directory="$PWD"
          --setenv="PATH=$PATH" --setenv="WORKFLOWD_AGENT_PROBE_NODE=$WORKFLOWD_AGENT_PROBE_NODE"
          bun test test/agent-user/client-versions.test.ts
      - name: Prepare disposable credential identities and trusted clients
        run: bash scripts/evidence/credential-host-setup.sh identities
      # These simulated-manager/process fixtures must remain namespace PID 1
      # to reap orphaned UID children. Host resource commands are denied here.
      - name: Require administrative credential coverage
        run: |
          mkdir -p coverage/administrative
          sudo systemd-run --wait --pipe --collect \
            -p MemoryMax=6G -p MemorySwapMax=0 --working-directory="$PWD" \
            --setenv=PATH=/opt/workflowd-credential-fixture/bin:/usr/bin:/bin \
            --setenv=WORKFLOWD_AGENT_TEST_BEN_UID=61001 \
            --setenv=WORKFLOWD_AGENT_TEST_AGENT_UID=61002 \
            --setenv=WORKFLOWD_AGENT_TEST_AUTH_GID=61000 \
            /usr/bin/unshare --pid --fork --mount-proc --net \
            /bin/sh -c 'ip link set lo up && export PATH="$PWD/test/resources/forbidden:$PATH" && exec "$@"' fixture \
            /opt/workflowd-credential-fixture/bin/bun test --coverage \
            --coverage-dir=coverage/administrative \
            --test-name-pattern='^(installed|offline migration|a replaced login|missing links|an admission lease|interrupted repair|repair after|the host|relink |a FIFO|host transport|admitted)' \
            test/agent-user/client-versions.test.ts \
            test/agent-user/credentials.e2e.test.ts \
            test/agent-user/credential-dispatch.e2e.test.ts \
            test/agent-user/native.e2e.test.ts \
            test/agent-user/opencode-migration.e2e.test.ts
      - name: Generate Bun LCOV
        run: |
          # Migration needs privileged /proc access; refresh probes need network
          # isolation. The preceding step checks administrative modules with unchanged Bun
          # thresholds. Every other module is checked here with those thresholds.
          python3 - <<'PY'
          import os
          from pathlib import Path
          config = Path("bunfig.toml").read_text()
          key = "coveragePathIgnorePatterns = ["
          assert config.count(key) == 1
          config = config.replace(key, key + '\n  "src/agent-host/opencode-credentials.ts",\n  "src/agent-host/credentials.ts",\n  "src/agent-host/config.ts",\n  "src/agent-host/credential-relink.ts",\n  "src/agent-host/client.ts",\n  "src/agent-host/server.ts",\n  "test/agent-user/harness.ts",', 1)
          Path(os.environ["RUNNER_TEMP"], "ordinary-coverage.toml").write_text(config)
          PY
          WORKFLOWD_FIXTURE_NOSCOPE="$RUNNER_TEMP/capability-tools/bin/noscope" \
            bun test --config="$RUNNER_TEMP/ordinary-coverage.toml" --coverage
      - name: Include administrative coverage in shared gates
        run: |
          # Use the complete, independently threshold-checked administrative record.
          # No duplicate file records may mask ordinary-suite coverage.
          python3 - <<'PY'
          from pathlib import Path
          paths = ["src/agent-host/" + name + ".ts" for name in ["opencode-credentials", "credentials", "config", "credential-relink", "client", "server"]] + ["test/agent-user/harness.ts"]
          administrative = Path("coverage/administrative/lcov.info").read_text()
          report = Path("coverage/lcov.info")
          ordinary = report.read_text()
          for path in paths:
              marker = f"SF:{path}\n"
              records = [record for record in administrative.split("end_of_record\n") if marker in record.splitlines(keepends=True)]
              assert len(records) == 1, f"administrative coverage missing or duplicated: {path}"
              assert marker not in ordinary.splitlines(keepends=True), f"duplicate coverage: {path}"
              ordinary += records[0] + "end_of_record\n"
          report.write_text(ordinary)
          PY
      - name: Require 80% changed executable line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run coverage:changed "$BASE_SHA" "$HEAD_SHA"
      - name: Fail on CRAP >= 30
        run: bun run crap:check

  credential-host:
    name: Credential host (two-UID)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Anonymous checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin https://github.com/BNasraoui/workflowd.git
          git -c credential.helper= -c http.extraHeader= fetch --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git checkout --detach "$HEAD_SHA"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          token: ""
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # The tests job and the credential-host job share this setup script, one phase per step.
      - name: Install pinned sandbox clients
        run: bash scripts/evidence/credential-host-setup.sh clients
      - name: Pin credential probe runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
          token: ""
      - name: Record credential probe runtime and prepare sandbox user namespaces
        run: bash scripts/evidence/credential-host-setup.sh namespaces
      - name: Prepare disposable credential identities and trusted clients
        run: bash scripts/evidence/credential-host-setup.sh identities
      # The gateway runs as agent-fixture and is configured for ben-fixture as its daemon and for
      # a third uid of their group as its front; the callers of each socket are its own uid,
      # another uid of that group and a uid outside it. The script runs as root only to take each
      # uid. It mints no run token, so noscope is any executable here.
      - name: Require the control socket and the listener to accept only their own uid across users
        run: >-
          sudo systemd-run --wait --pipe --collect
          -p MemoryMax=2G -p MemorySwapMax=0 --working-directory="$PWD"
          --setenv=HOME=/tmp
          --setenv=PATH=/opt/workflowd-credential-fixture/bin:/usr/bin:/bin
          --setenv=WORKFLOWD_FIXTURE_NOSCOPE=/usr/bin/false
          /opt/workflowd-credential-fixture/bin/bun scripts/evidence/control-socket-users.ts
      - name: Probe two-UID native supervision prerequisites
        run: >-
          sudo systemd-run --wait --pipe --collect
          -p MemoryMax=6G -p MemorySwapMax=0 --working-directory="$PWD"
          --setenv=PATH=/opt/workflowd-credential-fixture/bin:/usr/bin:/bin
          --setenv=WORKFLOWD_AGENT_TEST_BEN_UID=61001
          --setenv=WORKFLOWD_AGENT_TEST_AGENT_UID=61002
          --setenv=WORKFLOWD_AGENT_TEST_AUTH_GID=61000
          /opt/workflowd-credential-fixture/bin/bun
          scripts/evidence/agent-user.mjs --probe-supervision
      - name: Require two-UID native launch and recovery
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect \
          -p MemoryMax=6G -p MemorySwapMax=0 --working-directory="$PWD" \
          --setenv=PATH=/opt/workflowd-credential-fixture/bin:/usr/bin:/bin \
          --setenv=WORKFLOWD_AGENT_DEPLOYED_TEST=1 \
          --setenv=WORKFLOWD_AGENT_TEST_BEN_UID=61001 \
          --setenv=WORKFLOWD_AGENT_TEST_AGENT_UID=61002 \
          --setenv=WORKFLOWD_AGENT_TEST_AUTH_GID=61000 \
          /opt/workflowd-credential-fixture/bin/bun test \
          test/agent-user/native.e2e.test.ts \
          test/kernel/codex-systemd-custody.test.ts \
          test/kernel/cli-launch-uncertainty.test.ts \
          test/remote/claude-resume-runner-store.test.ts --reporter=junit --reporter-outfile=/tmp/workflowd-native-tests.xml
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/workflowd-native-tests.xml').findall('.//testcase')
          for name in [
              'two-UID native services retain custody across controller restart and refuse forged launches',
              'the host native protocol uses bounded custody with a simulated manager and real UID children',
          ]:
              matching = [case for case in cases if case.get('name') == name]
              assert len(matching) == 1 and len(matching[0]) == 0, f'Missing or unsuccessful required test: {name}'
          PYTEST
      - name: Require two-UID credential admission and repair
        run: |
          set -euo pipefail
          sudo systemd-run --wait --pipe --collect \
          -p MemoryMax=6G -p MemorySwapMax=0 --working-directory="$PWD" \
          --setenv=PATH=/opt/workflowd-credential-fixture/bin:/usr/bin:/bin \
          --setenv=WORKFLOWD_AGENT_TEST_BEN_UID=61001 \
          --setenv=WORKFLOWD_AGENT_TEST_AGENT_UID=61002 \
          --setenv=WORKFLOWD_AGENT_TEST_AUTH_GID=61000 \
          /opt/workflowd-credential-fixture/bin/bun test \
          test/agent-user/credentials.e2e.test.ts \
          test/agent-user/credential-dispatch.e2e.test.ts \
          test/agent-user/opencode-migration.e2e.test.ts --reporter=junit --reporter-outfile=/tmp/workflowd-credential-tests.xml
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/workflowd-credential-tests.xml').findall('.//testcase')
          assert len(cases) >= 58, f'Expected at least 58 credential tests, got {len(cases)}'
          assert all(len(case) == 0 for case in cases), 'Credential tests failed or skipped'
          for name in [
              'a replaced login refuses even with identical bytes; explicit relink restores both links',
              'relink auto preserves an opposite-side login replaced during import',
              'relink ben preserves an opposite-side login replaced during import',
              'relink caps a source that grows after its size check',
              'relink swaps back a source replaced after the final path check',
              'relink preserves an unvalidated displaced login left by an interrupted exchange',
              'relink preserves a source rewritten in place by a concurrent watcher',
              'relink refuses an active or uncertain unit recorded in host custody',
          ]:
              assert sum(case.get('name') == name for case in cases) == 1, f'Missing required test: {name}'
          PYTEST
      - name: Require agent OpenCode migration and three-client App publishing
        run: |
          set -euo pipefail
          sudo systemctl start user@0.service
          sudo systemd-run --wait --pipe --collect \
            -p MemoryMax=6G -p MemorySwapMax=0 --working-directory="$PWD" \
            --setenv=PATH=/opt/workflowd-credential-fixture/bin:/usr/bin:/bin \
            --setenv=WORKFLOWD_AGENT_TEST_BEN_UID=61001 \
            --setenv=WORKFLOWD_AGENT_TEST_AGENT_UID=61002 \
            --setenv=WORKFLOWD_AGENT_TEST_AUTH_GID=61000 \
            /opt/workflowd-credential-fixture/bin/bun scripts/evidence/agent-user.mjs --probe-opencode
          sudo systemd-run --wait --pipe --collect \
            -p MemoryMax=6G -p MemorySwapMax=0 --working-directory="$PWD" \
            --setenv=XDG_RUNTIME_DIR=/run/user/0 \
            --setenv=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/0/bus \
            --setenv=PATH=/opt/workflowd-credential-fixture/bin:/usr/bin:/bin \
            --setenv=WORKFLOWD_AGENT_TEST_BEN_UID=61001 \
            --setenv=WORKFLOWD_AGENT_TEST_AGENT_UID=61002 \
            --setenv=WORKFLOWD_AGENT_TEST_AUTH_GID=61000 \
            /opt/workflowd-credential-fixture/bin/bun test \
            test/agent-user/github.e2e.test.ts test/agent-user/opencode.e2e.test.ts \
            test/worker-identity test/resident \
            --reporter=junit --reporter-outfile=/tmp/workflowd-publishing-tests.xml
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/workflowd-publishing-tests.xml').findall('.//testcase')
          assert all(len(case) == 0 for case in cases), 'Publishing tests failed or skipped'
          for name in [
              'installed Codex, Claude and OpenCode push and open PRs with run-bound App identity',
              'agent OpenCode startup retains Git identity and isolates project and controller configuration',
              'agent OpenCode service checks migrated sole ownership before starting the agent UID',
              'OpenCode recovered mailbox prompts refuse before provider I/O when migration admission fails',
              'OpenCode agent-run completion crosses the run-bound subscription socket',
              'OpenCode restart as controller UID recovers persisted delivery (sending=false)',
              'OpenCode restart as controller UID recovers persisted delivery (sending=true)',
          ]:
              assert sum(case.get('name') == name for case in cases) == 1, f'Missing required test: {name}'
          PYTEST

  capability-security:
    name: Capability security (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        suite: [core, gateway, publication-local, final-local, gateway-budget, gateway-renewal]
    steps:
      - name: Anonymous checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin https://github.com/BNasraoui/workflowd.git
          git -c credential.helper= -c http.extraHeader= fetch --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git checkout --detach "$HEAD_SHA"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          token: ""
          no-cache: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
          token: ""
      - name: Install dependencies
        run: node deploy/sandbox/public-output.mjs setup -- bash scripts/evidence/capability-ci-setup.sh dependencies
      - name: Prepare disposable fixture namespace
        run: node deploy/sandbox/public-output.mjs setup -- bash scripts/evidence/capability-ci-setup.sh namespace
      - name: Prepare pinned fixture-only tools
        run: node deploy/sandbox/public-output.mjs setup -- bash scripts/evidence/capability-ci-setup.sh tools
      - name: Require every named fixture case
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          tools="$RUNNER_TEMP/capability-tools/bin"
          export WORKFLOWD_FIXTURE_NOSCOPE="$tools/noscope"
          # Each prints the number of cases that ran and the name of each case that failed.
          python3 scripts/evidence/check-isolated-fixture.py
          python3 scripts/evidence/isolated-fixture.py bun scripts/check-capability-security.ts --suite "$SUITE"

  aislop:
    name: AI slop (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - name: Anonymous checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin https://github.com/BNasraoui/workflowd.git
          git -c credential.helper= -c http.extraHeader= fetch --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git checkout --detach "$HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
          token: ""
      - name: Run aislop
        env:
          AISLOP_NO_TELEMETRY: "1"
          AISLOP_SKIP_TOOL_DOWNLOAD: "1"
        run: npx --yes aislop@0.13.1 scan --json

  gateway-image:
    permissions: {}
    uses: ./.github/workflows/gateway-image.yml

  # On a push to main the image that CI built and tested is the one published: one build.
  gateway-image-publish:
    name: Publish gateway image to GHCR by digest
    needs: gateway-image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gateway-image
      # The build job passed its tests; the archive must still be the bytes its build step wrote.
      - name: Require the archive that the build wrote
        env:
          ARCHIVE: ${{ needs.gateway-image.outputs.archive }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE" =~ ^[a-f0-9]{64}$ ]]
          echo "$ARCHIVE  gateway-image.tar.gz" | sha256sum -c -
      - name: Publish the tested image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ $REPOSITORY == BNasraoui/workflowd ]] || exit 0
          docker load -i gateway-image.tar.gz
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          image=ghcr.io/bnasraoui/workflowd-gateway
          docker tag workflowd-gateway:local "$image:$COMMIT_SHA"
          docker push "$image:$COMMIT_SHA"
          docker logout ghcr.io
          printf 'Published: %s\n' "$(docker image inspect --format '{{index .RepoDigests 0}}' "$image:$COMMIT_SHA")" | tee -a "$GITHUB_STEP_SUMMARY"

  required-checks:
    name: Required checks
    if: always()
    needs:
      - quality
      - repository-validation
      - deployment-validation
      - tests
      - credential-host
      - capability-security
      - gateway-image
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require all blocking checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          REPOSITORY_RESULT: ${{ needs.repository-validation.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-validation.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CREDENTIAL_HOST_RESULT: ${{ needs.credential-host.result }}
          CAPABILITY_RESULT: ${{ needs.capability-security.result }}
          # Success with "false" when a pull request changes no input of the image and nothing builds.
          GATEWAY_IMAGE_RESULT: ${{ needs.gateway-image.result }}
          GATEWAY_IMAGE_CHANGED: ${{ needs.gateway-image.outputs.changed }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || \
                "$REPOSITORY_RESULT" != "success" || \
                "$DEPLOYMENT_RESULT" != "success" || \
                "$TESTS_RESULT" != "success" || \
                "$CREDENTIAL_HOST_RESULT" != "success" || \
                "$CAPABILITY_RESULT" != "success" || \
                "$GATEWAY_IMAGE_RESULT" != "success" || \
                ! "$GATEWAY_IMAGE_CHANGED" =~ ^(true|false)$ ]]; then
            printf 'Quality: %s\nRepository integrity: %s\nDeployment: %s\nTests: %s\nCredential host: %s\nCapability security: %s\nGateway image: %s (inputs changed: %s)\n' \
              "$QUALITY_RESULT" "$REPOSITORY_RESULT" "$DEPLOYMENT_RESULT" "$TESTS_RESULT" "$CREDENTIAL_HOST_RESULT" "$CAPABILITY_RESULT" "$GATEWAY_IMAGE_RESULT" "$GATEWAY_IMAGE_CHANGED"
            exit 1
          fi
