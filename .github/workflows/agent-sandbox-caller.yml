name: Agent sandbox lease

on:
  push:
    branches: [workflowd/leases/**]

permissions: {}

jobs:
  sandbox:
    if: >-
      github.event.deleted == false &&
      github.actor_id == '306741873' &&
      github.repository_id == '1306107007' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/agent-sandbox.yml
    with:
      repository-id: "1306107007"
      app-actor-id: "306741873"
      tailscale-client-id: ${{ vars.TS_AGENT_CLIENT_ID }}
      tailscale-audience: ${{ vars.TS_AGENT_AUDIENCE }}

  agent-publish:
    needs: sandbox
    environment: agent-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out reviewed publisher tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BNasraoui/workflowd
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/agent-publish
            deploy/sandbox
          path: trusted
      - name: Publish validated agent result
        uses: ./trusted/.github/actions/agent-publish
        with:
          github-token: ${{ github.token }}
          gate-actor-id: "306741873"
          publisher-private-key: ${{ secrets.GHETTIMONSTER_PRIVATE_KEY }}
          publisher-app-id: ${{ vars.GHETTIMONSTER_APP_ID }}
