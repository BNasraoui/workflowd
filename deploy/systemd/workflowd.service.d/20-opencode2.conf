# Orders workflowd after the agent OpenCode server without binding their lifetimes.
# Requires= would make systemd stop workflowd whenever opencode2-server.service is
# stopped or restarted (for example by its watchdog), which ends every run's reports.
[Unit]
After=opencode2-server.service
Wants=opencode2-server.service
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
RestartSec=10
