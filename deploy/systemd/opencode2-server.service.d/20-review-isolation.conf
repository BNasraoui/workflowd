UnsetEnvironment=OPENCODE_CONFIG_CONTENT OPENCODE_CONFIG_DIR WORKFLOWD_MCP_TOKEN WORKFLOWD_MCP_TOKEN_FILE WORKFLOWD_MCP_DISPATCH_TOKEN WORKFLOWD_MCP_DISPATCH_TOKEN_FILE WORKFLOWD_AGENT_RUN_TOKEN WORKFLOWD_AGENT_RUN_TOKEN_FILE
